plugins {
    id 'tapestry.junit5-convention'
    id 'antlr'
}

description = 'Fast class property discovery, reading and writing library based on bytecode generation. Extracted from Apache Tapestry, but not dependent on the Web framework (tapestry-core) nor the IoC one (tapestry-ioc).'

dependencies {
    implementation project(':plastic')
    implementation project(':tapestry5-annotations')
    implementation project(':commons')

    implementation libs.slf4j.api

    antlr libs.antlr

    // Transitive will bring in the unwanted string template library as well
    implementation(libs.antlr.runtime) {
        exclude group: 'org.antlr', module: 'stringtemplate'
    }
}

tasks.named('clean') {
    delete generateGrammarSource.outputDirectory
}

tasks.named('generateGrammarSource', AntlrTask) {
    // The parser imports the token types of the lexer, but an incremental run regenerates only
    // the changed grammar. A non-incremental input makes every change regenerate both.
    inputs.files(source).withPropertyName('allGrammars').withPathSensitivity(PathSensitivity.RELATIVE)
}

tasks.named('compileJava', JavaCompile) {
    dependsOn generateGrammarSource
    options.fork = true
    options.forkOptions.memoryMaximumSize = '512M'
}

tasks.named('sourcesJar') {
    dependsOn 'generateGrammarSource'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

sourceSets {
    main {
        java {
            srcDir generateGrammarSource.outputDirectory
        }
    }
}

tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'default-charset'
    }
}

// Parsing must not depend on the platform default charset, which is not UTF-8 everywhere before Java 18.
def testDefaultCharset = tasks.register('testDefaultCharset', Test) {
    description = 'Runs the tests tagged default-charset under a US-ASCII default charset.'
    group = 'verification'

    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useJUnitPlatform {
        includeTags 'default-charset'
    }

    systemProperty 'file.encoding', 'US-ASCII'
}

tasks.named('check') {
    dependsOn testDefaultCharset
}
