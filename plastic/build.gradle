plugins {
    id 'tapestry.junit5-spock-convention'
    id 'tapestry.jmh-convention'
}

description = 'High-level runtime transformations of Java classes'

dependencies {
    implementation libs.slf4j.api
}

// add vendored ASM
sourceSets {
    main {
        java {
            srcDir 'src/external/java'
        }
    }
}
